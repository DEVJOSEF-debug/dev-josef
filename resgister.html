<body>
    <head>
        <h1>UNISERVE EDUCATION FAIR 2026</h1>
        <nav>
          <a href="index.html">HOME</a>
            <a href="schedule.html">SCHEDULE</a>
            <a href="register.html">REGISTER</a>

            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRWUxuV3IRmC2E1RL-TXV7FzHboMlnh503i1jcBTfSe5w&s"alt="UNISERVE EDUCATION FAIR LOGO">"" 
        </nav>
    </head>
    <main>
        <section>
            <h2>REGISTER FOR THE EVENT</h2>
            <p>Please fill in the form below to register for the UNISERVE Education Fair 2026</p>
        </section>
        <section>
            <form action="#" method="post">
                <!--Full name, email, phone; text inputs-->
                <p>
                    <label for="fullname">Full name:</label><br>
                    <input type="text" id="fullname" name="fullname" required>
                </p>
                <p>
                    <label for="email">email</label><br>
                    <input type="email" id="email" name="email" required>
                </p>
                <p>
<label for="phone number">Phone Number</label><br>
<input type="tel" id="phone" name="phone" required>
                </p>

                <!--gender radio buttons-->
                <p>
                    <strong>GENDER</strong><br>
                    <input type="radio" id="male" name="gender" value="Male" required>
                    <label for="male">Male</label><br>

                    <input type="radio" id="female" name="gender" value="Female">
                    <label for="female">Female</label><br>

                </p>

                <!--age group dropdown select-->
                <p>
                    <label for="agegroup">Age Group</label><br>
                    <select id="agegroup" name="agegroup"
                    <option value=""></option>
                </p>
            </form>
        </section>
    </main>
</body>
